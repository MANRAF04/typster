name: Release

# Run it from the Actions tab: pick a branch and type the new version. It bumps
# the version on that branch, builds every platform into a draft release, and
# publishes the release (creating its tag) once all of them succeed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, for example 0.2.0
        required: true

concurrency: release

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not a version like 0.2.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released"
            exit 1
          fi
      - name: Set the version
        run: |
          sed -i "s/^  \"version\": \".*\",$/  \"version\": \"$VERSION\",/" src-tauri/tauri.conf.json package.json
          sed -i "0,/^version = /s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"typster\"$/{n;s/^version = .*/version = \"$VERSION\"/}" src-tauri/Cargo.lock
          for file in src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml; do
            grep -qF "\"$VERSION\"" "$file" || { echo "::error::Couldn't set the version in $file"; exit 1; }
          done
          grep -A1 '^name = "typster"$' src-tauri/Cargo.lock | grep -qF "version = \"$VERSION\"" \
            || { echo "::error::Couldn't set the version in Cargo.lock"; exit 1; }
      - name: Commit the version
        id: commit
        run: |
          # A rerun after a failed build finds the version already committed.
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.tauri.outputs.releaseId }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Release builds sign update packages and look for updates in this repository.
      - name: Configure updates
        shell: bash
        run: >
          echo '{"bundle": {"createUpdaterArtifacts": true}, "plugins": {"updater": {"endpoints":
          ["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'
          > src-tauri/tauri.release.conf.json
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Typster v__VERSION__
          releaseBody: Download the installer for your platform below.
          releaseDraft: true
          includeUpdaterJson: true
          # The tag must point at the version commit, not the commit the run started on.
          releaseCommitish: ${{ needs.bump.outputs.sha }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  # Only a complete release goes public, so the updater never sees a partial one.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api -X PATCH repos/${{ github.repository }}/releases/${{ needs.build.outputs.release-id }}
          -F draft=false -f make_latest=true
